[package]
name = "temporalex_nif"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# DSF spike only (G2 battery row 17): `debug_arm_fault/2` arms a one-shot panic
# or abort in the NIF glue. Never enabled in a normal build.
fault-injection = []

[dependencies]
anyhow = "1"
prost = "0.14"
prost-types = { version = "0.7", package = "prost-wkt-types" }
rustler = "=0.37.3"
serde_json = "1"
temporalio-client = { git = "https://github.com/temporalio/sdk-rust", tag = "v1.0.0", features = ["core-based-sdk"] }
# `otel` turns on the OTLP metric exporter. The `prometheus` exporter is already
# enabled transitively via temporalio-client's `core-based-sdk` feature.
temporalio-common = { git = "https://github.com/temporalio/sdk-rust", tag = "v1.0.0", features = ["otel"] }
temporalio-sdk-core = { git = "https://github.com/temporalio/sdk-rust", tag = "v1.0.0" }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
